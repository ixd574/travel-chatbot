<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Healthcare Appointment Assistant</title>
    <link rel="stylesheet" href="styles.css" id="theme-link">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="icon" type="image/x-icon" href="tab_logo.ico">
</head>
<body>
    <div class="app-container">
        <div class="glass-panel sidebar">
            <div class="logo">
                <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 107 27"><path fill="#000000" fill-rule="evenodd" d="M66.663 7.735v18.781h-2.672V7.736h2.672Zm-26.367 0v2.613H31.74v4.767h8.48v2.607h-8.48v6.19h8.48v2.604H29.064V7.736h11.231Zm42.776 0 8.83 18.781h-2.896l-2.843-5.893h-7.25l-2.817 5.893h-2.969l8.952-18.78h.993Zm-79.431 0 7.087 14.172L17.74 7.735h.93l2.73 18.782h-2.65l-1.647-11.81-5.893 11.81h-.994L4.25 14.61l-1.64 11.907H0L2.711 7.735h.93Zm46.61 0v16.202h6.964v2.58h-9.629V7.735h2.666Zm32.311 5.237-2.41 5.06h4.82l-2.41-5.06ZM86.347 0l1.597 1.321c-.802 1.591-1.89 2.39-3.266 2.39-.468 0-1.235-.233-2.297-.698-.77-.381-1.338-.57-1.714-.57-.458 0-.926.43-1.392 1.295l-1.644-1.384.362-.512a6.956 6.956 0 0 1 .676-.832c.222-.233.438-.422.67-.562a2.15 2.15 0 0 1 .703-.313c.244-.063.506-.1.789-.1.653 0 1.418.223 2.27.647.875.445 1.437.665 1.69.665.467 0 .99-.451 1.556-1.347Z"></path></svg>
            </div>
            <div class="booking-summary" id="booking-summary">
                <h3>Your Appointment</h3>
                <div class="summary-content">
                    <p>No appointment yet</p>
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="glass-panel chat-container">
                <div class="chat-header">
                    <h2>Healthcare AI Assistant</h2>
                    <div class="chat-actions">
                        <button id="theme-button">
                            <img id="theme-icon" src="/white.svg" alt="Theme Icon" width="24" height="24" >
                        </button>
                        <button id="clear-chat" class="glass-button small">
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>
                            Clear
                        </button>
                    </div>
                </div>

                <div class="chat-messages" id="chat-messages">
                    <!-- Messages will be added here -->
                </div>

                <div class="chat-input-container">
                    <input type="text" id="user-input" placeholder="Type your message here..." class="chat-input">
                    <button id="send-button" class="send-button">
                        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                    </button>
                </div>
            </div>

            <div class="glass-panel options-container" id="options-container">
                <!-- Dynamic options will be displayed here -->
            </div>
        </div>
    </div>

    <!-- Templates for dynamic content -->
    <template id="appointment-options-template">
        <div class="appointment-options">
            <div class="options-header">
                <h3>Available times with <span class="doctor-name"></span></h3>
            </div>
            <div class="options-buttons slot-list">
                <!-- Buttons added dynamically -->
            </div>
        </div>
    </template>

    <script src="script.js"></script>
</body>
</html>
